services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chartsense
      POSTGRES_PASSWORD: chartsense
      POSTGRES_DB: chartsense
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chartsense"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  # One-shot job that creates the upload bucket.
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-minioadmin} $${S3_SECRET_KEY:-minioadmin}; do sleep 1; done;
      mc mb --ignore-existing local/$${S3_BUCKET:-chartsense};
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-chartsense}

  analysis:
    build: ./analysis
    env_file: .env
    environment:
      S3_ENDPOINT: http://minio:9000
    ports: ["8000:8000"]
    depends_on: [minio]

  web:
    build: ./web
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chartsense:chartsense@postgres:5432/chartsense
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      ANALYSIS_SERVICE_URL: http://analysis:8000
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      analysis: { condition: service_started }

  # Consumes the dataset-processing queue: parse → validate → recommend → rank.
  worker:
    build: { context: ./web, target: worker }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chartsense:chartsense@postgres:5432/chartsense
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      ANALYSIS_SERVICE_URL: http://analysis:8000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      analysis: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
